<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Image diagnostic</title>
<style>
  /* Exact same rules the live property cards use */
  .prop-carousel {
    position: relative;
    height: 220px;
    overflow: hidden;
    background: #0d1b2a;
  }
  .carousel-track { display: flex; height: 100%; }
  .carousel-slide {
    flex: 0 0 100%;
    width: 100%; min-width: 100%; max-width: 100%;
    height: 100%; position: relative; overflow: hidden;
  }
  .carousel-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @media(max-width:600px){
    .prop-carousel { height: auto; aspect-ratio: 4 / 3; }
  }

  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; background: #fff; color: #111; }
  h1 { font-size: 17px; margin: 0 0 12px; }
  .card { border: 2px solid #0d1b2a; margin-bottom: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 15px; margin-bottom: 20px; }
  td { padding: 6px 4px; border-bottom: 1px solid #eee; vertical-align: top; }
  td:first-child { color: #666; width: 52%; }
  td:last-child { font-weight: 700; font-variant-numeric: tabular-nums; }
  .ok { color: #0a7; } .bad { color: #c22; }
  .ref { max-width: 100%; display: block; border: 2px dashed #999; }
  h2 { font-size: 14px; margin: 18px 0 6px; color: #666; font-weight: 600; }
</style>
</head>
<body>

<h1>Card rendering on this device</h1>

<h2>1. As the card shows it</h2>
<div class="card">
  <div class="prop-carousel" id="car">
    <div class="carousel-track">
      <div class="carousel-slide"><img id="img" alt="test"/></div>
    </div>
  </div>
</div>

<h2>2. The complete original photo</h2>
<img class="ref" id="ref" alt="reference"/>

<h2>3. Measurements</h2>
<table id="out"></table>

<script>
const SB = 'https://hegstrjpfompikkwxmpl.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhlZ3N0cmpwZm9tcGlra3d4bXBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMTk4ODksImV4cCI6MjA5MDc5NTg4OX0.1vZXK6lrlI3yprlCPopgZoo1EOtjJg3YVdwHrKeT83w';

function row(k, v, cls) {
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${k}</td><td class="${cls||''}">${v}</td>`;
  document.getElementById('out').appendChild(tr);
}

(async () => {
  let url = null;
  try {
    const res = await fetch(`${SB}/rest/v1/properties?status=eq.Available&select=name,image_url&limit=20`, {
      headers: { apikey: KEY, Authorization: 'Bearer ' + KEY }
    });
    const rows = await res.json();
    const p = rows.find(r => /Hadrian/i.test(r.name) && r.image_url) || rows.find(r => r.image_url);
    if (p) url = p.image_url.split(',')[0].trim();
  } catch (e) {}

  if (!url) { row('Could not load a photo', String(e), 'bad'); return; }

  const img = document.getElementById('img');
  const ref = document.getElementById('ref');
  img.src = url; ref.src = url;

  await new Promise(r => { if (img.complete && img.naturalWidth) r(); else { img.onload = r; img.onerror = r; } });
  await new Promise(r => setTimeout(r, 400));

  const car = document.getElementById('car');
  const cb  = car.getBoundingClientRect();
  const cs  = getComputedStyle(car);
  const boxR = cb.width / cb.height;
  const imgR = img.naturalWidth / img.naturalHeight;
  const visible = imgR > boxR ? boxR / imgR : imgR / boxR;
  const pct = Math.round(visible * 100);

  row('Screen width (CSS px)', window.innerWidth);
  row('Device pixel ratio', window.devicePixelRatio);
  row('Visual viewport scale', (window.visualViewport ? window.visualViewport.scale.toFixed(2) : 'n/a'));
  row('Supports aspect-ratio', CSS.supports('aspect-ratio', '4 / 3') ? 'YES' : 'NO', CSS.supports('aspect-ratio','4 / 3') ? 'ok' : 'bad');
  row('Computed aspect-ratio', cs.aspectRatio, cs.aspectRatio === '4 / 3' ? 'ok' : 'bad');
  row('Computed height rule', cs.height);
  row('Frame size', Math.round(cb.width) + ' x ' + Math.round(cb.height));
  row('Frame ratio', boxR.toFixed(3));
  row('Photo size', img.naturalWidth + ' x ' + img.naturalHeight);
  row('Photo ratio', imgR.toFixed(3));
  row('object-fit', getComputedStyle(img).objectFit);

  // The real test: is the <img> box itself the same size as the frame?
  // If it is wider, the frame clips it and the photo looks zoomed.
  const ib = img.getBoundingClientRect();
  const slide = document.querySelector('.carousel-slide').getBoundingClientRect();
  const overflows = ib.width > cb.width + 1;
  row('Slide box width', Math.round(slide.width), Math.abs(slide.width - cb.width) < 2 ? 'ok' : 'bad');
  row('IMG box size', Math.round(ib.width) + ' x ' + Math.round(ib.height), overflows ? 'bad' : 'ok');
  row('IMG wider than frame?', overflows ? 'YES — this is the bug' : 'no', overflows ? 'bad' : 'ok');

  const realVisible = overflows ? Math.round((cb.width / ib.width) * 100) : pct;
  row('PHOTO VISIBLE', realVisible + '%', realVisible >= 99 ? 'ok' : 'bad');
  row('Cropped on', overflows ? 'right side (clipped)' : (imgR > boxR ? 'left/right' : (imgR < boxR ? 'top/bottom' : 'nothing')), realVisible >= 99 ? 'ok' : 'bad');
})();
</script>
</body>
</html>
